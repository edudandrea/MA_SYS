<div class="page-header">
  <div class="page-title-group">
    <h1>Modalidades</h1>
    <p>Acompanhe alunos, professores e status em uma grade de cadastro objetiva.</p>
  </div>
</div>

<div class="modalidades-page">
  <div class="cadastro-list">
    <div class="list-head modalidades-row">
      <span>Modalidade</span>
      <span>Academia</span>
      <span>Alunos</span>
      <span>Professores</span>
      <span>Status</span>
      <span></span>
    </div>

    <div class="empty-state" *ngIf="!modalidades || modalidades.length === 0">
      <i class="fa-solid fa-user-slash"></i>
      <p>Nenhuma modalidade cadastrada</p>
    </div>

    <button type="button" class="list-row modalidades-row" *ngFor="let modalidade of modalidades; trackBy: trackByModalidade" (click)="editarModalidade(templateNovaModalidade, modalidade)">
      <span class="entity-cell">
        <span class="avatar small">{{ getInicial(modalidade.nomeModalidade) }}</span>
        <strong>{{ modalidade.nomeModalidade }}</strong>
      </span>

      <span>{{ modalidade.academiaNome || 'Sem Academia' }}</span>
      <span>{{ modalidade.totalAlunos || 0 }}</span>
      <span>{{ modalidade.totalProf || 0 }}</span>
      <span>
        <span
          class="status clickable"
          [class.ativo]="modalidade.ativo"
          [class.inativo]="!modalidade.ativo"
          (click)="$event.stopPropagation(); toggleStatus(modalidade)"
        >
          {{ modalidade.ativo ? 'Ativo' : 'Inativo' }}
        </span>
      </span>
      <span class="row-actions">
        <button type="button" class="icon-action danger" title="Excluir" (click)="$event.stopPropagation(); excluirModalidade(modalidade.id)">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </span>
    </button>
  </div>
</div>

<button class="floating-add" (click)="openModalNovaModalidade(templateNovaModalidade)">
  <i class="fa-solid fa-plus"></i>
  <span class="fab-text"> Nova Modalidade </span>
</button>

<ng-template #templateNovaModalidade>
  <div class="modal-content">
    <div class="modal-header">
      <h4>{{ editarId ? 'Editar Modalidade' : 'Nova Modalidade' }}</h4>
      <button type="button" class="btn-close" (click)="cancelarEdicao()"></button>
    </div>

    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full">
          <label>Nome da Modalidade</label>
          <div class="input-modern">
            <i class="fa-solid fa-hand-fist"></i>
            <input *ngIf="!editarId" [(ngModel)]="novaModalidade.nomeModalidade" />
            <input *ngIf="editarId" [(ngModel)]="nomeModalidade" />
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cancelarEdicao()">Cancelar</button>
      <button class="btn-save" (click)="salvarModal()">
        {{ editarId ? 'Salvar alterações' : 'Salvar' }}
      </button>
    </div>
  </div>
</ng-template>
