<div class="page-header">
  <div class="page-title-group">
    <h1>{{ tituloPagina }}</h1>
    <p>Cadastre valores, prazos e meses liberados para uso do sistema.</p>
  </div>
</div>

<div class="mensalidades-page">
  <div class="cadastro-list">
    <div class="list-head mensalidades-row">
      <span>Mensalidade</span>
      <span>Valor</span>
      <span>Prazo</span>
      <span>Pagamentos</span>
      <span>Mercado Pago</span>
      <span>Status</span>
    </div>

    <div class="empty-state" *ngIf="!mensalidades || mensalidades.length === 0">
      <i class="fa-solid fa-file-invoice-dollar"></i>
      <p>Nenhuma mensalidade do sistema cadastrada</p>
    </div>

    <button type="button" class="list-row mensalidades-row" *ngFor="let mensalidade of mensalidades" (click)="editarMensalidade(templateNovaMensalidade, mensalidade)">
      <span class="entity-cell">
        <span class="avatar small"><i class="fa-solid fa-file-invoice-dollar"></i></span>
        <span>
          <strong>{{ mensalidade.mesesUso }} {{ mensalidade.mesesUso === 1 ? 'mês' : 'meses' }} de uso</strong>
          <small>{{ mensalidade.descricao || 'Sem descrição adicional' }}</small>
        </span>
      </span>

      <span class="money">{{ formatarValor(mensalidade.valor) }}</span>
      <span>{{ mensalidade.prazoPagamentoDias }} dias</span>
      <span class="payment-badges">
        <span class="method-badge" [class.disabled]="!mensalidade.aceitaPix">
          <i class="fa-solid fa-qrcode"></i>
          PIX
        </span>
        <span class="method-badge" [class.disabled]="!mensalidade.aceitaCartao">
          <i class="fa-solid fa-credit-card"></i>
          Cartão
        </span>
      </span>
      <span>{{ mensalidade.mercadoPagoPublicKey ? 'Configurado' : 'Pendente' }}</span>
      <span>
        <span
          class="status clickable"
          [class.ativo]="mensalidade.ativo"
          [class.inativo]="!mensalidade.ativo"
          (click)="$event.stopPropagation(); toggleStatus(mensalidade)"
        >
          {{ mensalidade.ativo ? 'Ativa' : 'Inativa' }}
        </span>
      </span>
    </button>
  </div>
</div>

<button class="floating-add" (click)="openModalNovaMensalidade(templateNovaMensalidade)">
  <i class="fa-solid fa-plus"></i>
  <span class="fab-text">Nova Mensalidade</span>
</button>

<ng-template #templateNovaMensalidade>
  <div class="modal-content">
    <div class="modal-header">
      <h4>{{ editarId ? 'Editar mensalidade do sistema' : 'Nova mensalidade do sistema' }}</h4>
      <button type="button" class="btn-close" (click)="cancelarEdicao()"></button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="form-group">
          <label>Valor</label>
          <input type="number" [(ngModel)]="valor" name="valorMensalidadeSistema" />
        </div>

        <div class="form-group">
          <label>Prazo de pagamento (dias)</label>
          <input type="number" [(ngModel)]="prazoPagamentoDias" name="prazoPagamentoDiasMensalidadeSistema" />
        </div>

        <div class="form-group">
          <label>Meses de uso</label>
          <input type="number" [(ngModel)]="mesesUso" name="mesesUsoMensalidadeSistema" />
        </div>

        <div class="form-group full">
          <label>Descrição</label>
          <input [(ngModel)]="descricao" name="descricaoMensalidadeSistema" />
        </div>

        <div class="form-group full">
          <label>Formas de pagamento habilitadas</label>
          <div class="checkbox-row">
            <label><input type="checkbox" [(ngModel)]="aceitaPix" name="aceitaPixMensalidadeSistema" /> PIX</label>
            <label><input type="checkbox" [(ngModel)]="aceitaCartao" name="aceitaCartaoMensalidadeSistema" /> Cartão de crédito</label>
          </div>
        </div>

        <div class="form-group full">
          <label>Chave pública Mercado Pago</label>
          <input [(ngModel)]="mercadoPagoPublicKey" name="mercadoPagoPublicKeyMensalidadeSistema" placeholder="APP_USR... ou TEST..." />
        </div>

        <div class="form-group full">
          <label>Access Token Mercado Pago</label>
          <input [(ngModel)]="mercadoPagoAccessToken" name="mercadoPagoAccessTokenMensalidadeSistema" placeholder="APP_USR... ou TEST..." />
        </div>
      </form>
    </div>

    <div class="modal-footer form-actions">
      <button class="btn-cancel" (click)="cancelarEdicao()">Cancelar</button>
      <button class="btn-save" (click)="salvarModal()">
        {{ editarId ? 'Salvar alterações' : 'Salvar mensalidade' }}
      </button>
    </div>
  </div>
</ng-template>
