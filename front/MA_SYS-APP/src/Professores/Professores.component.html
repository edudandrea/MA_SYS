<div class="page-header">
  <div class="page-title-group">
    <h1>Professores</h1>
    <p>Visualize vínculos, graduação e carga de alunos em grade operacional.</p>
  </div>
</div>

<div class="professores-page">
  <div class="cadastro-list">
    <div class="list-head professores-row">
      <span>Professor</span>
      <span>Modalidade</span>
      <span>Academia</span>
      <span>Contato</span>
      <span>Alunos</span>
      <span>Status</span>
      <span></span>
    </div>

    <div class="empty-state" *ngIf="!professores || professores.length === 0">
      <i class="fa-solid fa-user-slash"></i>
      <p>Nenhum professor cadastrado</p>
    </div>

    <button type="button" class="list-row professores-row" *ngFor="let professor of professores" (click)="editarProfessor(templateNovoProfessor, professor)">
      <span class="entity-cell">
        <span class="avatar small">{{ getInicial(professor.nome) }}</span>
        <span>
          <strong>{{ professor.nome }}</strong>
          <small>{{ professor.graduacao || 'Graduação não informada' }}</small>
        </span>
      </span>

      <span>{{ professor.nomeModalidade || 'Modalidade não informada' }}</span>
      <span>{{ professor.academiaNome || 'Não informada' }}</span>
      <span>
        <strong class="line-value">{{ professor.telefone || 'Sem telefone' }}</strong>
        <small>{{ professor.email || 'Sem email' }}</small>
      </span>
      <span>{{ professor.totalAlunos || 0 }}</span>
      <span>
        <span
          class="status clickable"
          [class.ativo]="professor.ativo"
          [class.inativo]="!professor.ativo"
          (click)="$event.stopPropagation(); toggleStatus(professor)"
        >
          {{ professor.ativo ? 'Ativo' : 'Inativo' }}
        </span>
      </span>
      <span class="row-actions">
        <button type="button" class="icon-action danger" title="Excluir" (click)="$event.stopPropagation(); excluirProfessor(professor.id)">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </span>
    </button>
  </div>
</div>

<button class="floating-add" (click)="openModalNovoProfessor(templateNovoProfessor)">
  <i class="fa-solid fa-plus"></i>
  <span class="fab-text"> Novo Professor </span>
</button>

<ng-template #templateNovoProfessor>
  <div class="modal-content">
    <div class="modal-header">
      <h4>{{ editarId ? 'Editar Professor' : 'Novo Professor' }}</h4>
      <button type="button" class="btn-close" (click)="cancelarEdicao()"></button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="form-group full">
          <label>Nome</label>
          <input [(ngModel)]="nome" name="nome" />
        </div>

        <div class="form-group">
          <label>Graduação</label>
          <input [(ngModel)]="graduacao" name="graduacao" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input [(ngModel)]="email" name="email" />
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input [(ngModel)]="telefone" name="telefone" />
        </div>

        <div class="form-group">
          <label>Academia</label>
          <select [(ngModel)]="academiaId" (change)="onAcademiaChange()" name="academiaId">
            <option *ngFor="let a of academias" [ngValue]="a.id">
              {{ a.nome }}
            </option>
          </select>
        </div>

        <div class="form-group full">
          <label>Modalidade</label>
          <select [(ngModel)]="modalidadeId" name="modalidadeId">
            <option [ngValue]="0">Selecione</option>
            <option *ngFor="let modalidade of modalidadesFiltradas" [ngValue]="modalidade.id">
              {{ modalidade.nomeModalidade }}
            </option>
          </select>
        </div>
      </form>
    </div>

    <div class="modal-footer form-actions">
      <button class="btn-cancel" (click)="cancelarEdicao()">Cancelar</button>
      <button class="btn-save" (click)="salvarModal()">
        {{ editarId ? 'Salvar alterações' : 'Salvar Professor' }}
      </button>
    </div>
  </div>
</ng-template>
