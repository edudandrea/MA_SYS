<div class="page-header">
  <div class="page-title-group">
    <h1>Pagamentos</h1>
    <p>Gerencie condições de pagamento com leitura executiva de prazo, taxa e parcelamento.</p>
  </div>
</div>

<div class="pagamentos-page">
  <div class="cadastro-list">
    <div class="list-head pagamentos-row">
      <span>Forma</span>
      <span>Academia</span>
      <span>Parcelas</span>
      <span>Taxa</span>
      <span>Dias</span>
      <span>Status</span>
    </div>

    <div class="empty-state" *ngIf="!pagamentos || pagamentos.length === 0">
      <i class="fa-solid fa-user-slash"></i>
      <p>Nenhuma forma de pagamento cadastrada</p>
    </div>

    <button type="button" class="list-row pagamentos-row" *ngFor="let pagamento of pagamentos" (click)="editarFormaPagamento(templateNovaFormaPgto, pagamento)">
      <span class="entity-cell">
        <span class="avatar small">{{ getInicial(pagamento.nome) }}</span>
        <strong>{{ pagamento.nome }}</strong>
      </span>

      <span>{{ pagamento.academiaNome || (isFederacao ? 'Federação' : 'Configuração operacional') }}</span>
      <span>{{ pagamento.parcelas }}</span>
      <span>{{ pagamento.taxa }}%</span>
      <span>{{ pagamento.dias }}</span>
      <span>
        <span
          class="status clickable"
          [class.ativo]="pagamento.ativo"
          [class.inativo]="!pagamento.ativo"
          (click)="$event.stopPropagation(); toggleStatus(pagamento)"
        >
          {{ pagamento.ativo ? 'Ativo' : 'Inativo' }}
        </span>
      </span>
    </button>
  </div>
</div>

<button class="floating-add" (click)="openModalNovoPgto(templateNovaFormaPgto)">
  <i class="fa-solid fa-plus"></i>
  <span class="fab-text">Forma de pagamento</span>
</button>

<ng-template #templateNovaFormaPgto>
  <div class="modal-content">
    <div class="modal-header">
      <h4>{{ editarId ? 'Editar forma de pagamento' : 'Nova forma de pagamento' }}</h4>
      <button type="button" class="btn-close" (click)="cancelarEdicao()"></button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="form-group full">
          <label>Nome</label>
          <input [(ngModel)]="nome" name="nome" />
        </div>

        <div class="form-group">
          <label>Qtd. de parcelas</label>
          <input type="number" [(ngModel)]="parcelas" name="parcelas" />
        </div>

        <div class="form-group">
          <label>Taxa %</label>
          <input type="number" [(ngModel)]="taxa" name="taxa" />
        </div>

        <div class="form-group">
          <label>Qtd. de dias</label>
          <input type="number" [(ngModel)]="dias" name="dias" />
        </div>

        <div class="form-group" *ngIf="editarId">
          <label>Status</label>
          <select [(ngModel)]="ativo" name="ativo">
            <option [ngValue]="true">Ativo</option>
            <option [ngValue]="false">Inativo</option>
          </select>
        </div>

        <div class="form-group full" *ngIf="!isAcademia && !isFederacao">
          <label>Academia</label>
          <select [(ngModel)]="academiaId" name="academiaId">
            <option *ngFor="let academia of academias" [ngValue]="academia.id">
              {{ academia.nome }}
            </option>
          </select>
        </div>
      </form>
    </div>

    <div class="modal-footer form-actions">
      <button class="btn-cancel" (click)="cancelarEdicao()">Cancelar</button>
      <button class="btn-save" (click)="salvarModal()">
        {{ editarId ? 'Salvar alterações' : 'Salvar forma de pagamento' }}
      </button>
    </div>
  </div>
</ng-template>
