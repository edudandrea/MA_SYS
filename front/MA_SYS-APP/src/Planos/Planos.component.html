<div class="page-header">
  <div class="page-title-group">
    <h1>Planos</h1>
    <p>Compare valor, duração e adesão dos planos em uma lista objetiva.</p>
  </div>
</div>

<div class="planos-page">
  <div class="cadastro-list">
    <div class="list-head planos-row">
      <span>Plano</span>
      <span>Academia</span>
      <span>Valor</span>
      <span>Duração</span>
      <span>Status</span>
    </div>

    <div class="empty-state" *ngIf="!planos || planos.length === 0">
      <i class="fa-solid fa-user-slash"></i>
      <p>Nenhum plano cadastrado</p>
    </div>

    <button type="button" class="list-row planos-row" *ngFor="let plano of planos" (click)="editarPlano(templateNovoPlano, plano)">
      <span class="entity-cell">
        <span class="avatar small">{{ getInicial(plano.nome) }}</span>
        <strong>{{ plano.nome }}</strong>
      </span>

      <span>{{ plano.academiaNome || (isFederacao ? 'Plano da federação' : 'Academia não informada') }}</span>
      <span class="money">{{ plano.valor | currency:'BRL' }}</span>
      <span>{{ plano.duracaoMeses }} meses</span>
      <span>
        <span
          class="status clickable"
          [class.ativo]="plano.ativo"
          [class.inativo]="!plano.ativo"
          (click)="$event.stopPropagation(); toggleStatus(plano)"
        >
          {{ plano.ativo ? 'Ativo' : 'Inativo' }}
        </span>
      </span>
    </button>
  </div>
</div>

<button class="floating-add" (click)="openModalNovoPlano(templateNovoPlano)">
  <i class="fa-solid fa-plus"></i>
  <span class="fab-text"> Novo Plano </span>
</button>

<ng-template #templateNovoPlano>
  <div class="modal-content">
    <div class="modal-header">
      <h4>{{ editarId ? 'Editar Plano' : 'Novo Plano' }}</h4>
      <button type="button" class="btn-close" (click)="cancelarEdicao()"></button>
    </div>

    <div class="modal-body">
      <form class="form-grid">
        <div class="form-group full">
          <label>Nome</label>
          <input [(ngModel)]="nome" name="nome" />
        </div>

        <div class="form-group">
          <label>Valor</label>
          <input type="number" [(ngModel)]="valor" name="valor" />
        </div>

        <div class="form-group">
          <label>Duração (meses)</label>
          <input type="number" [(ngModel)]="duracaoMeses" name="duracaoMeses" />
        </div>

        <div class="form-group full" *ngIf="!isAcademia && !isFederacao">
          <label>Academia</label>
          <select [(ngModel)]="academiaId" name="academiaId">
            <option *ngFor="let academia of academias" [ngValue]="academia.id">
              {{ academia.nome }}
            </option>
          </select>
        </div>
      </form>
    </div>

    <div class="modal-footer form-actions">
      <button class="btn-cancel" (click)="cancelarEdicao()">Cancelar</button>
      <button class="btn-save" (click)="salvarModal()">
        {{ editarId ? 'Salvar alterações' : 'Salvar Plano' }}
      </button>
    </div>
  </div>
</ng-template>
